<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Channel - Telegram Join</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle, #608272 0%, #3a5749 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
        }

        /* Red Banner / Button Styling */
        .red-btn {
            display: block;
            width: 100%;
            background-color: #FF0000;
            color: #FFFF00; /* Yellow Text */
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 2px;
            line-height: 1.3;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease-in-out;
        }

        .red-btn:active {
            transform: scale(0.98);
        }

        /* Small Text inside Banner */
        .small-text {
            font-size: 18px;
            display: block;
        }

        /* Center Logo Image Styling */
        .logo-box {
            width: 220px;
            height: 220px;
            border: 2px solid #FF0000;
            box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.5);
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Top Small Tag -->
        <a href="https://t.me/vipchannelu" class="red-btn small-text">
            EXPORT RATING
        </a>

        <!-- Main Top Button -->
        <a href="https://t.me/vipchannelu" class="red-btn">
            telegram<br>VIP channel join now
        </a>

        <!-- Center Channel Logo -->
        <a href="https://t.me/vipchannelu" class="logo-box">
            <!-- यहाँ अपनी इमेज का नाम/URL डालें -->
            <img src="file_00000000dae48211a99080b6f41d99b8.png" alt="VI Channel Logo">" alt="VI Channel Logo">" alt="VI Channel Logo">
        </a>

        <!-- Main Bottom Button -->
        <a href="https://t.me/vipchannelu" class="red-btn">
            telegram<br>VIP channel join now
        </a>

        <!-- Bottom Small Tag -->
        <a href="https://t.me/vipchannelu" class="red-btn small-text">
            EXPORT RATING

</body>
