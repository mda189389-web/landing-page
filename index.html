<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VI Channel - Exclusive Trading Insights</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #3d5a52 0%, #4a685e 35%, #597368 65%, #2d453d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Top Red Banner */
        .top-banner {
            background-color: #ff0000;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 25px;
            border-radius: 2px;
            width: 100%;
        }

        /* Logo Styling */
        .logo-box {
            width: 220px;
            height: 220px;
            background-color: #000000;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            border-radius: 4px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Footer/Disclaimer Red Banner */
        .disclaimer-banner {
            background-color: #ff0000;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 20px;
            border-radius: 2px;
            width: 100%;
        }

        /* Join Now CTA Button */
        .btn-join {
            display: inline-block;
            background-color: #ff0000;
            color: #ffff00;
            font-size: 38px;
            font-weight: 900;
            text-decoration: none;
            padding: 10px 30px;
            border-radius: 4px;
            text-transform: lowercase;
            letter-spacing: 1px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-join:hover {
            transform: scale(1.05);
            background-color: #cc0000;
        }

        /* Responsive Fixes */
        @media (max-width: 400px) {
            .btn-join {
                font-size: 30px;
                padding: 8px 20px;
            }
            .logo-box {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Text Banner -->
        <div class="top-banner">
            Join our exclusive trading community to receive expert insights and market analysis. Stay updated with the latest trends and enhance your trading knowledge
        </div>

        <!-- Logo Image Box (Direct GitHub Image Link) -->
        <div class="logo-box">
            <img src="https://raw.githubusercontent.com/mda189389-web/landing-page/main/file_00000000dae48211a99080b6f41d99b8.png" alt="VI Channel Logo">
        </div>

        <!-- Disclaimer & Terms Banner -->
        <div class="disclaimer-banner">
            Exclusive Trading Insights<br>
            2026 VI Channel. Trading involves risk. Please read our Privacy Policy and Terms of Service
        </div>

        <!-- Telegram Join Button -->
        <a href="https://t.me/vipchannelu" target="_blank" class="btn-join">join now</a>
    </div>

</body>
</html>
