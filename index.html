<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afroz Gaming - BGMI Tournament</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #7b8e73;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        .header-box {
            background-color: #ff0000;
            color: #ffff00;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 15px;
            border-radius: 4px;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-transform: lowercase;
        }

        .logo-box {
            border: 3px solid #ff0000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            width: 250px;
            height: 250px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-join {
            background-color: #ff0000;
            color: #ffff00;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            padding: 12px 35px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            text-transform: lowercase;
        }

        .btn-join:hover {
            transform: scale(1.05);
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Text -->
        <div class="header-box">
            bgmi tournament se Judi full jankari is channel per aapko milega click now
        </div>

        <!-- Logo Image -->
        <div class="logo-box">
            <!-- apni image ka link ya naam yahan daalein -->
            <img src="file_00000000464c8208b490f1530fded181.png" alt="Afroz Gaming">
        </div>

        <!-- Join Now Button with Telegram Link -->
        <a href="https://t.me/AFROZGAMING1" target="_blank" class="btn-join">
            join now
        </a>
    </div>
